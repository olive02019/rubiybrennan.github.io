<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust | Travel Photography Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .masonry-grid {
            column-count: 1;
            column-gap: 1.5rem;
        }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
        }
        .modal-fade {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">

    <!-- Header / Hero Section -->
    <header class="relative overflow-hidden border-b border-slate-900 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Wanderlust Journal</h1>
                    <p class="text-xs text-slate-400">Captured moments from around the globe</p>
                </div>
            </div>

            <!-- Navigation / Trip Filters -->
            <nav id="filter-container" class="flex flex-wrap gap-2 justify-center" aria-label="Trip Filters">
                <!-- Dynamically populated via JavaScript -->
            </nav>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Active Trip Banner (Optional descriptive header) -->
        <div id="trip-banner" class="mb-8 hidden bg-slate-900/80 border border-slate-800 rounded-2xl p-6 sm:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span id="banner-tag" class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 uppercase tracking-wider">Destination</span>
                <h2 id="banner-title" class="text-2xl sm:text-3xl font-extrabold text-white mt-2">Trip Title</h2>
                <p id="banner-desc" class="text-slate-400 mt-1 text-sm max-w-2xl">Trip description goes here...</p>
            </div>
            <div class="text-xs text-slate-400 bg-slate-950/60 px-4 py-2 rounded-xl border border-slate-800/80">
                <span id="banner-count" class="font-bold text-white">0</span> photos captured
            </div>
        </div>

        <!-- Masonry Photo Gallery Grid -->
        <div id="gallery-grid" class="masonry-grid">
            <!-- Photos populated dynamically -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-24">
            <svg class="w-16 h-16 mx-auto text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <h3 class="text-lg font-medium text-slate-300">No photos found for this trip</h3>
            <p class="text-sm text-slate-500 mt-1">Try selecting a different destination above.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-8 text-center text-xs text-slate-500">
        <p>&copy; 2026 Wanderlust Photo Journal. All static images sourced via Unsplash.</p>
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl hidden flex items-center justify-center p-4 sm:p-6" role="dialog" aria-modal="true">
        <button id="lightbox-close" class="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-900/80 hover:bg-slate-800 p-3 rounded-full transition border border-slate-800">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

        <button id="lightbox-prev" class="absolute left-4 sm:left-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white bg-slate-900/80 hover:bg-slate-800 p-3 rounded-full transition border border-slate-800">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <button id="lightbox-next" class="absolute right-4 sm:right-8 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white bg-slate-900/80 hover:bg-slate-800 p-3 rounded-full transition border border-slate-800">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>

        <div class="max-w-5xl w-full max-h-[90vh] flex flex-col items-center justify-center modal-fade">
            <img id="lightbox-img" src="" alt="Expanded Photo" class="max-h-[75vh] max-w-full object-contain rounded-2xl shadow-2xl border border-slate-800/80 mb-4">
            <div class="text-center">
                <span id="lightbox-badge" class="text-xs px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium"></span>
                <h3 id="lightbox-title" class="text-lg font-bold text-white mt-2"></h3>
                <p id="lightbox-location" class="text-xs text-slate-400 mt-0.5"></p>
            </div>
        </div>
    </div>

    <!-- JavaScript Data & Logic -->
    <script>
        // ==========================================
        // TRIP DATA CONFIGURATION (STATIC)
        // Add, remove, or edit trips and photos here!
        // ==========================================
        const tripsData = [
            {
                id: "all",
                name: "All Trips",
                description: "A complete collection of travel photography from all destinations.",
                photos: [] // Populated automatically from all trips
            },
            {
                id: "japan-2025",
                name: "🇯🇵 Kyoto & Tokyo",
                description: "Cherry blossoms, historic temples, neon skylines, and serene bamboo forests across Japan.",
                photos: [
                    {
                        url: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1200&auto=format&fit=crop",
                        title: "Kyoto Pagoda at Dusk",
                        location: "Kyoto, Japan",
                        date: "April 2025"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1200&auto=format&fit=crop",
                        title: "Shibuya Crossing Neon",
                        location: "Tokyo, Japan",
                        date: "April 2025"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1542051841857-5f90071e7989?q=80&w=1200&auto=format&fit=crop",
                        title: "Arashiyama Bamboo Grove",
                        location: "Kyoto, Japan",
                        date: "April 2025"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1528164344705-475426879c0d?q=80&w=1200&auto=format&fit=crop",
                        title: "Traditional Torii Gate",
                        location: "Hakone, Japan",
                        date: "April 2025"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1200&auto=format&fit=crop",
                        title: "Tokyo Tower View",
                        location: "Tokyo, Japan",
                        date: "April 2025"
                    }
                ]
            },
            {
                id: "swiss-alps",
                name: "🇨🇭 Swiss Alps",
                description: "Snow-capped peaks, crystal clear glacial lakes, and cozy alpine villages.",
                photos: [
                    {
                        url: "https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=1200&auto=format&fit=crop",
                        title: "Matterhorn Peak in Morning Light",
                        location: "Zermatt, Switzerland",
                        date: "January 2026"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1527668752550-91495257007b?q=80&w=1200&auto=format&fit=crop",
                        title: "Alpine Valley Express",
                        location: "Grindelwald, Switzerland",
                        date: "January 2026"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1491557345352-5929e343eb89?q=80&w=1200&auto=format&fit=crop",
                        title: "Lake Oeschinen Reflection",
                        location: "Kandersteg, Switzerland",
                        date: "January 2026"
                    }
                ]
            },
            {
                id: "amalfi-coast",
                name: "🇮🇹 Amalfi Coast",
                description: "Cliffside pastel villages, deep azure waters, and sun-soaked lemon groves.",
                photos: [
                    {
                        url: "https://images.unsplash.com/photo-1533105079780-92b9be482077?q=80&w=1200&auto=format&fit=crop",
                        title: "Positano Cliffside Homes",
                        location: "Positano, Italy",
                        date: "September 2024"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1516483638261-f4dbaf036963?q=80&w=1200&auto=format&fit=crop",
                        title: "Capri Sea Arch",
                        location: "Capri, Italy",
                        date: "September 2024"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1200&auto=format&fit=crop",
                        title: "Ravello Terrace Sunset",
                        location: "Ravello, Italy",
                        date: "September 2024"
                    }
                ]
            },
            {
                id: "iceland",
                name: "🇮🇸 Iceland Ring Road",
                description: "Dramatic waterfalls, black sand beaches, roaring geysers, and dancing northern lights.",
                photos: [
                    {
                        url: "https://images.unsplash.com/photo-1504893524553-b855bce32c67?q=80&w=1200&auto=format&fit=crop",
                        title: "Skógafoss Waterfall",
                        location: "South Iceland",
                        date: "October 2024"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1529963183134-61a90db47eaf?q=80&w=1200&auto=format&fit=crop",
                        title: "Black Sand Beach Basalt Columns",
                        location: "Vik, Iceland",
                        date: "October 2024"
                    },
                    {
                        url: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1200&auto=format&fit=crop",
                        title: "Aurora Borealis over Glacier Lagoon",
                        location: "Jökulsárlón, Iceland",
                        date: "October 2024"
                    }
                ]
            }
        ];

        // Populate 'All Trips' aggregate array
        tripsData[0].photos = tripsData.slice(1).flatMap(trip => 
            trip.photos.map(p => ({ ...p, tripName: trip.name }))
        );

        let currentActiveTripId = "all";
        let currentFilteredPhotos = [];
        let currentLightboxIndex = 0;

        // DOM Elements
        const filterContainer = document.getElementById("filter-container");
        const galleryGrid = document.getElementById("gallery-grid");
        const emptyState = document.getElementById("empty-state");
        const tripBanner = document.getElementById("trip-banner");
        const bannerTitle = document.getElementById("banner-title");
        const bannerDesc = document.getElementById("banner-desc");
        const bannerTag = document.getElementById("banner-tag");
        const bannerCount = document.getElementById("banner-count");

        // Lightbox Elements
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const lightboxTitle = document.getElementById("lightbox-title");
        const lightboxLocation = document.getElementById("lightbox-location");
        const lightboxBadge = document.getElementById("lightbox-badge");
        const lightboxClose = document.getElementById("lightbox-close");
        const lightboxPrev = document.getElementById("lightbox-prev");
        const lightboxNext = document.getElementById("lightbox-next");

        // Initialize Filter Buttons
        function renderFilters() {
            filterContainer.innerHTML = "";
            tripsData.forEach(trip => {
                const btn = document.createElement("button");
                const isActive = trip.id === currentActiveTripId;
                btn.className = `px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 border ${
                    isActive 
                    ? "bg-indigo-600 text-white border-indigo-500 shadow-lg shadow-indigo-600/30 scale-105" 
                    : "bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800 hover:text-slate-200"
                }`;
                btn.textContent = trip.name;
                btn.onclick = () => switchTrip(trip.id);
                filterContainer.appendChild(btn);
            });
        }

        // Switch active trip view
        function switchTrip(tripId) {
            currentActiveTripId = tripId;
            renderFilters();
            renderGallery();
        }

        // Render Photo Gallery
        function renderGallery() {
            const activeTrip = tripsData.find(t => t.id === currentActiveTripId);
            currentFilteredPhotos = activeTrip.photos;

            // Update Banner
            if (currentActiveTripId === "all") {
                tripBanner.classList.add("hidden");
            } else {
                tripBanner.classList.remove("hidden");
                bannerTag.textContent = activeTrip.name.split(" ")[0];
                bannerTitle.textContent = activeTrip.name.substring(3).trim();
                bannerDesc.textContent = activeTrip.description;
                bannerCount.textContent = currentFilteredPhotos.length;
            }

            galleryGrid.innerHTML = "";

            if (currentFilteredPhotos.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            }

            emptyState.classList.add("hidden");

            currentFilteredPhotos.forEach((photo, index) => {
                const card = document.createElement("div");
                card.className = "masonry-item group relative overflow-hidden rounded-2xl bg-slate-900 border border-slate-800/80 cursor-pointer shadow-md hover:shadow-2xl hover:border-indigo-500/50 transition-all duration-300";
                
                const parentTripName = photo.tripName || activeTrip.name;

                card.innerHTML = `
                    <div class="overflow-hidden aspect-auto bg-slate-900">
                        <img src="${photo.url}" alt="${photo.title}" loading="lazy" class="w-full h-auto object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-5">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-md w-fit mb-2">${parentTripName}</span>
                        <h4 class="text-white font-bold text-base leading-tight">${photo.title}</h4>
                        <div class="flex items-center justify-between text-xs text-slate-300 mt-1">
                            <span>📍 ${photo.location}</span>
                            <span class="text-slate-400">${photo.date}</span>
                        </div>
                    </div>
                `;

                card.onclick = () => openLightbox(index);
                galleryGrid.appendChild(card);
            });
        }

        // Lightbox Control
        function openLightbox(index) {
            currentLightboxIndex = index;
            updateLightboxContent();
            lightbox.classList.remove("hidden");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.add("hidden");
            document.body.style.overflow = "auto";
        }

        function updateLightboxContent() {
            const photo = currentFilteredPhotos[currentLightboxIndex];
            const activeTrip = tripsData.find(t => t.id === currentActiveTripId);
            const parentTripName = photo.tripName || activeTrip.name;

            lightboxImg.src = photo.url;
            lightboxTitle.textContent = photo.title;
            lightboxLocation.textContent = `📍 ${photo.location} • ${photo.date}`;
            lightboxBadge.textContent = parentTripName;
        }

        function nextLightboxPhoto() {
            currentLightboxIndex = (currentLightboxIndex + 1) % currentFilteredPhotos.length;
            updateLightboxContent();
        }

        function prevLightboxPhoto() {
            currentLightboxIndex = (currentLightboxIndex - 1 + currentFilteredPhotos.length) % currentFilteredPhotos.length;
            updateLightboxContent();
        }

        // Event Listeners for Lightbox
        lightboxClose.onclick = closeLightbox;
        lightboxNext.onclick = nextLightboxPhoto;
        lightboxPrev.onclick = prevLightboxPhoto;

        // Close on background click
        lightbox.onclick = (e) => {
            if (e.target === lightbox) closeLightbox();
        };

        // Keyboard Navigation
        document.addEventListener("keydown", (e) => {
            if (lightbox.classList.contains("hidden")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowRight") nextLightboxPhoto();
            if (e.key === "ArrowLeft") prevLightboxPhoto();
        });

        // Initial Render on Load
        renderFilters();
        renderGallery();
    </script>
</body>
</html>
